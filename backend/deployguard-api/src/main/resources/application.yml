spring:
  application:
    name: deployguard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deployguard}
    username: ${DB_USERNAME:deployguard}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:deployguard}
    password: ${RABBITMQ_PASSWORD:deployguard}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

deployguard:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  github:
    # Shared secret configured on the GitHub webhook. Blank disables ingestion (endpoint returns 503).
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  ai-analysis:
    max-attempts: ${AI_ANALYSIS_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${AI_ANALYSIS_INITIAL_BACKOFF_MS:1000}
    max-backoff-ms: ${AI_ANALYSIS_MAX_BACKOFF_MS:10000}
  auth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    jwt:
      signing-key: ${JWT_SIGNING_KEY:dev-only-signing-key-change-me-0123456789abcdef0123456789abcdef}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${PORT:${SERVER_PORT:8080}}
