services:
  postgres:
    image: postgres:16
    platform: linux/arm64
    environment:
      POSTGRES_DB: deployguard
      POSTGRES_USER: deployguard
      POSTGRES_PASSWORD: deployguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployguard -d deployguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: deployguard
      RABBITMQ_DEFAULT_PASS: deployguard
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ../ai-service
    environment:
      PORT: 8001
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend/deployguard-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: deployguard
      DB_USERNAME: deployguard
      DB_PASSWORD: deployguard
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: deployguard
      RABBITMQ_PASSWORD: deployguard
      AI_SERVICE_BASE_URL: http://ai-service:8001
      FRONTEND_ALLOWED_ORIGINS: http://localhost:3000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef0123456789abcdef}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      ai-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
